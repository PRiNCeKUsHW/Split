{% with ns=request.resolver_match.namespace name=request.resolver_match.url_name %}
<nav class="bottom-nav" aria-label="Main">

  <a href="{% url 'core:dashboard' %}"
     class="{% if ns == 'core' and name == 'dashboard' %}active{% endif %}"
     {% if ns == 'core' and name == 'dashboard' %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
    </svg>
    <span>Home</span>
  </a>

  <a href="{% url 'expenses:list' %}"
     class="{% if ns == 'expenses' and name != 'add' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/>
    </svg>
    <span>Expenses</span>
  </a>

  <a href="{% url 'expenses:add' %}" class="nav-add" aria-label="Add an expense">
    <span class="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14"/><path d="M5 12h14"/>
      </svg>
    </span>
    <span>Add</span>
  </a>

  <a href="{% url 'settlements:settle_up' %}"
     class="{% if ns == 'settlements' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/>
    </svg>
    <span>Settle</span>
  </a>

  <a href="{% url 'core:summary' %}"
     class="{% if ns == 'accounts' or name == 'summary' or name == 'balances' or ns == 'recurring' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
    </svg>
    <span>Flat</span>
  </a>

</nav>
{% endwith %}
