<p class="eyebrow mb-2">This bill needs an amount</p>
<form hx-post="{% url 'expenses:draft_amount' expense.pk %}"
      hx-target="closest .card-flat"
      hx-swap="outerHTML">
  {% csrf_token %}
  <div class="d-flex gap-2 align-items-start">
    <div class="amount-field flex-grow-1 mb-0" style="font-size: 1.25rem">
      <span class="amount-symbol">&#8377;</span>
      {{ draft_form.amount }}
    </div>
    <button class="btn btn-primary" type="submit"><span class="htmx-idle">Split it</span><span class="htmx-busy">Wait&hellip;</span></button>
  </div>
  {% for error in draft_form.amount.errors %}
    <div class="text-danger small mt-2" role="alert">{{ error }}</div>
  {% endfor %}
</form>
