{% load static %}<!doctype html>
<html lang="en">
<head>
  <script>
    // Applied before the first paint, so there is no flash of the wrong
    // theme. Deliberately inline and blocking: a deferred script would paint
    // light, then correct itself.
    (function () {
      try {
        var choice = localStorage.getItem("flatsplit-theme");
        if (choice === "light" || choice === "dark") {
          document.documentElement.setAttribute("data-theme", choice);
        }
      } catch (e) {
        /* private mode: fall back to the system setting */
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="theme-color" content="#a78bfa">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline &middot; FlatSplit</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body style="padding-bottom:0">
  <div class="auth-wrap text-center">
    <p class="auth-mark"><span class="brand-mark">&#8377;</span> FlatSplit</p>
    <h1 class="h5 mt-3 mb-2">Can't reach the flat's computer</h1>
    <p class="text-body-secondary mb-4">
      FlatSplit runs on a machine in the flat. Check you're on the flat WiFi
      and that the computer is switched on.
    </p>
    <button class="btn btn-primary btn-lg w-100" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
